{% extends 'portfolio_app/base.html' %}

{% block title %}Contact Me{% endblock %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #fff;
        font-family: 'Poppins', sans-serif;
    }
    .contact-container {
        max-width: 900px;
        background: rgba(255, 255, 255, 0.2);
        padding: 50px;
        border-radius: 20px;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(15px);
        animation: fadeIn 0.8s ease-in-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .form-control {
        background: rgba(255, 255, 255, 0.3);
        border: none;
        color: #fff;
        padding: 14px;
        font-size: 18px;
        border-radius: 8px;
    }
    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.8);
    }
    .form-label {
        font-weight: bold;
        font-size: 18px;
    }
    @media (max-width: 768px) {
        .contact-container {
            padding: 30px;
            width: 90%;
        }
        .form-control {
            font-size: 16px;
            padding: 12px;
        }
        .form-label {
            font-size: 16px;
        }
    }
</style>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="contact-container text-center w-100">
        <h2 class="mb-4">Contact Me</h2>
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="POST" class="mt-4">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-4 text-start">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" name="name" required placeholder="Enter your name">
                </div>
                <div class="col-md-6 mb-4 text-start">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required placeholder="Enter your email">
                </div>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label">Subject</label>
                <input type="text" class="form-control" name="subject" required placeholder="Enter subject">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label">Message</label>
                <textarea class="form-control" name="message" rows="6" required placeholder="Write your message"></textarea>
            </div>
            <button type="submit" class="btn btn-custom w-100">Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
