<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}My Portfolio{% endblock %}</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #1B1B3A;
            color: #EEE;
        }

        .navbar {
            background: linear-gradient(135deg, #4C0070, #3B82F6);
            padding: 15px;
            transition: all 0.3s ease-in-out;
        }

        .navbar-brand {
            font-size: 26px;
            font-weight: 700;
            color: white !important;
            transition: 0.3s;
        }

        .navbar-brand:hover {
            color: #FFD700 !important;
        }

        .nav-link {
            font-size: 18px;
            color: white !important;
            margin: 0 12px;
            transition: 0.3s ease-in-out;
        }

        .nav-link:hover {
            color: #FFD700 !important;
            transform: scale(1.1);
        }

        .hero {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(to right, #4C0070, #3B82F6);
            color: white;
            padding: 50px;
            animation: fadeInUp 1s ease-in-out;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #FFD700;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 22px;
            font-weight: 300;
        }

        .btn-custom {
            background-color: #FFD700;
            color: #1B1B3A;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            transition: all 0.3s ease-in-out;
        }

        .btn-custom:hover {
            background-color: #E6B800;
            transform: translateY(-3px);
            box-shadow: 0px 10px 20px rgba(255, 215, 0, 0.4);
        }

        .footer {
            text-align: center;
            padding: 20px;
            background-color: #121212;
            color: white;
        }

        .social-icons a {
            color: white;
            font-size: 24px;
            margin: 0 10px;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: #FFD700;
            transform: scale(1.2);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">My Portfolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'projects' %}">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div>
            <img src="/static/images/profile.jpg" alt="Profile" class="profile-img">
            <h1>Hello, I'm Rahul Giri</h1>
            <p>Building high-performance web applications with Python & Django.</p>
            <a href="{% url 'projects' %}" class="btn btn-custom">View Projects</a>
        </div>
    </section>

    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <p>&copy; 2024 My Portfolio | Designed with ❤️</p>
        <div class="social-icons">
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-twitter"></i></a>
            <a href="#"><i class="bi bi-github"></i></a>
            <a href="#"><i class="bi bi-linkedin"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
